name: hadirin

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: hadirin-app
    ports:
      - "${APP_PORT:-8088}:80"
    volumes:
      - ./:/var/www/html
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11.4
    container_name: hadirin-db
    environment:
      MARIADB_DATABASE: ${DB_NAME:-hadirin}
      MARIADB_USER: ${DB_USER:-hadirin}
      MARIADB_PASSWORD: ${DB_PASS:-hadirin_secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_secret}
      TZ: Asia/Kuala_Lumpur
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+08:00"]
    ports:
      # Connect DBeaver to localhost:${DB_PORT}
      - "${DB_PORT:-3308}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mail:
    image: axllent/mailpit:v1.21
    container_name: hadirin-mail
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  db_data:
